name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: 构建、Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 先单独输出 JDK 与 --version 中的 Daemon JVM 行：daemon JVM 要求与 CI 安装的 JDK 不匹配时，
      # Gradle 会在任何任务开始前就失败，这行信息是唯一能直接定位该问题的证据。
      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      # Gradle 会把“找不到某依赖”的否结果写进 modules-2 元数据缓存，setup-gradle 又会把它随 Gradle User Home
      # 一起缓存；一旦某次运行写入错误的否结果，后续运行会在本地直接判负、根本不访问仓库。先用 refresh 强制重建。
      - name: 编译 Debug
        run: |
          set +e
          ./gradlew :app:assembleDebug --refresh-dependencies --stacktrace > gradle-build.log 2>&1
          status=$?
          cat gradle-build.log
          exit $status

      # Actions 日志需要登录才能下载；注解每步只保留前 10 条，因此把摘要合并成单条再发布。
      - name: 输出构建失败原因
        if: failure()
        run: |
          probe=/tmp/ksp-probe
          mkdir -p "$probe" /tmp/ksp-probe-home/wrapper
          printf '%s\n' 'pluginManagement { repositories { mavenCentral(); gradlePluginPortal() } }' > "$probe/settings.gradle.kts"
          printf '%s\n' 'rootProject.name = "ksp-probe"' >> "$probe/settings.gradle.kts"
          printf '%s\n' 'plugins { id("com.google.devtools.ksp") version "2.3.12" apply false }' > "$probe/build.gradle.kts"
          cp -R ~/.gradle/wrapper/dists /tmp/ksp-probe-home/wrapper/ 2>/dev/null || true
          if GRADLE_USER_HOME=/tmp/ksp-probe-home ./gradlew -p "$probe" help > /tmp/ksp-probe.log 2>&1; then
            probe_status=0
          else
            probe_status=$?
          fi
          {
            sed -n '/What went wrong/,$p' gradle-build.log | head -40
            echo "--- 网络线索 ---"
            grep -E "Could not GET|Received status code|Caused by|timed out|Connection refused" gradle-build.log | head -10
            echo "--- runner 探测 KSP 2.3.12 marker ---"
            for host in "https://repo1.maven.org/maven2" "https://plugins.gradle.org/m2" "https://dl.google.com/dl/android/maven2" "https://maven.aliyun.com/repository/gradle-plugin"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$host/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" || echo curl-failed)
              echo "$host -> $code"
            done
            echo "--- 干净 Gradle Home 解析 KSP ---"
            echo "exit=$probe_status"
            grep -E "What went wrong|Could not GET|Could not find|was not found|Plugin \[id" /tmp/ksp-probe.log | head -8
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 单元测试与覆盖率
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --stacktrace

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/jacocoTestReport
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  instrumented:
    name: 设备测试（Room / Hilt / Compose）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器运行 connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --refresh-dependencies --stacktrace > android-test.log 2>&1
            status=$?
            cat android-test.log
            exit $status

      - name: 输出设备测试失败原因
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,$p' android-test.log 2>/dev/null | head -30
            echo '--- 解析与网络线索 ---'
            grep -E "Could not GET|Received status code|Caused by|timed out|Connection refused" android-test.log 2>/dev/null | head -10
            echo '--- 日志末尾 ---'
            tail -5 android-test.log 2>/dev/null
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: 上传设备测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          if-no-files-found: warn
