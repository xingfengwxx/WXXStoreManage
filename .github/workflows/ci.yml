name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: 构建、Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 先单独输出 JDK 与 --version 中的 Daemon JVM 行：daemon JVM 要求与 CI 安装的 JDK 不匹配时，
      # Gradle 会在任何任务开始前就失败，这行信息是唯一能直接定位该问题的证据。
      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      # setup-gradle 会整份缓存 Gradle User Home。Gradle 对“找不到依赖”的否结果有约 24 小时的缓存，
      # 一旦历史缓存写入了错误的否结果，后续运行会在本地直接判负、不访问仓库，--refresh-dependencies 也不清除。
      - name: 清理依赖元数据缓存
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*

      - name: 编译 Debug
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          status=$?
          cat gradle-build.log
          exit $status

      # Actions 日志需要登录才能下载；注解每步只保留前 10 条，因此把摘要合并成单条再发布。
      - name: 输出构建失败原因
        if: failure()
        run: |
          probe=/tmp/ksp-probe
          mkdir -p "$probe" /tmp/home-probe/wrapper /tmp/home-real/wrapper
          cat > "$probe/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google { content { includeGroupByRegex("com\\.android.*"); includeGroupByRegex("com\\.google.*"); includeGroupByRegex("androidx.*") } }
                  maven("https://maven.aliyun.com/repository/google") { content { includeGroupByRegex("com\\.android.*"); includeGroupByRegex("com\\.google.*"); includeGroupByRegex("androidx.*") } }
                  maven("https://maven.aliyun.com/repository/gradle-plugin")
                  maven("https://maven.aliyun.com/repository/public")
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "ksp-probe"
          EOF
          printf '%s\n' 'plugins { id("com.google.devtools.ksp") version "2.3.12" apply false }' > "$probe/build.gradle.kts"
          cp -R ~/.gradle/wrapper/dists /tmp/home-probe/wrapper/ 2>/dev/null || true
          cp -R ~/.gradle/wrapper/dists /tmp/home-real/wrapper/ 2>/dev/null || true
          if GRADLE_USER_HOME=/tmp/home-probe ./gradlew -p "$probe" help > /tmp/p1.log 2>&1; then p1=0; else p1=$?; fi
          if GRADLE_USER_HOME=/tmp/home-real ./gradlew help > /tmp/p2.log 2>&1; then p2=0; else p2=$?; fi
          {
            sed -n '/What went wrong/,$p' gradle-build.log | head -30
            echo "--- 最小工程+项目仓库列表（干净 Home）exit=$p1 ---"
            grep -E "What went wrong|Could not GET|Could not find|was not found|Received status|UnknownHost|timed out" /tmp/p1.log | head -6
            echo "--- 真实工程（干净 Home）exit=$p2 ---"
            grep -E "What went wrong|Could not GET|Could not find|was not found|Received status|UnknownHost|timed out" /tmp/p2.log | head -6
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 单元测试与覆盖率
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --stacktrace

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/jacocoTestReport
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  instrumented:
    name: 设备测试（Room / Hilt / Compose）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      # 与 static-and-unit 相同的元数据缓存清理，原因见该任务中的注释。
      - name: 清理依赖元数据缓存
        run: rm -rf ~/.gradle/caches/modules-2/metadata-*

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器运行 connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > android-test.log 2>&1
            status=$?
            cat android-test.log
            exit $status

      - name: 输出设备测试失败原因
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,$p' android-test.log 2>/dev/null | head -30
            echo '--- 解析与网络线索 ---'
            grep -E "Could not GET|Received status code|Caused by|timed out|Connection refused" android-test.log 2>/dev/null | head -10
            echo '--- 日志末尾 ---'
            tail -5 android-test.log 2>/dev/null
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: 上传设备测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          if-no-files-found: warn
