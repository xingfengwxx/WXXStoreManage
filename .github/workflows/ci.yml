name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 支持手动重跑：模拟器与网络偶发波动时不必再推空提交。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: 构建、Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 先单独输出 JDK 与 --version 中的 Daemon JVM 行：daemon JVM 要求与 CI 安装的 JDK 不匹配时，
      # Gradle 会在任何任务开始前就失败，这行信息是唯一能直接定位该问题的证据。
      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      - name: 编译 Debug
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          status=$?
          cat gradle-build.log
          exit $status

      # Actions 日志需要登录才能下载；注解每步只保留前 10 条，因此把摘要合并成单条再发布。
      # 插件解析会把仓库 5xx 吞成“找不到插件”，所以同时用 HEAD 探测各仓库能否提供该 marker。
      - name: 输出构建失败原因
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,$p' gradle-build.log | head -30
            echo "--- 网络线索 ---"
            grep -E "Could not (GET|HEAD)|Received status code|UnknownHost|timed out|Connection refused" gradle-build.log | head -10
            echo "--- HEAD 探测 KSP marker jar ---"
            for host in "https://repo1.maven.org/maven2" "https://plugins.gradle.org/m2" "https://dl.google.com/dl/android/maven2" "https://maven.aliyun.com/repository/gradle-plugin"; do
              code=$(curl -s -I -o /dev/null -w '%{http_code}' -m 20 "$host/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.jar" || echo curl-failed)
              echo "$host -> $code"
            done
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 单元测试与覆盖率
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --stacktrace

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/jacocoTestReport
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  instrumented:
    name: 设备测试（Room / Hilt / Compose）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器运行 connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # AOSP 镜像比 google_apis 小得多、启动更快，这些测试不需要 Google 服务。
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: true
          # 该 action 文档把系统拼写检查列为文本框交互的常见 flaky 来源，登录用例要输入文本。
          disable-spellchecker: true
          # 运行器负载波动时冷启动可能超过默认 10 分钟，放宽到 20 分钟。
          emulator-boot-timeout: 1200
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > android-test.log 2>&1
            status=$?
            cat android-test.log
            exit $status

      - name: 输出设备测试失败原因
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,$p' android-test.log 2>/dev/null | head -6
            echo '--- 失败用例 ---'
            grep -E "FAILED|tests completed|Starting [0-9]+ tests|Test run failed|INSTRUMENTATION_|AssertionError|Process crashed" android-test.log 2>/dev/null | head -20
            echo '--- 结果 XML 中的失败信息 ---'
            find app/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A3 -E '<failure|<error' {} + 2>/dev/null | head -20
            echo '--- 日志末尾 ---'
            tail -5 android-test.log 2>/dev/null
          } | awk 'NF' | paste -sd'|' - | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: 上传设备测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          if-no-files-found: warn
