name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: 构建、Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 先单独输出 JDK 与 --version 中的 Daemon JVM 行：daemon JVM 要求与 CI 安装的 JDK 不匹配时，
      # Gradle 会在任何任务开始前就失败，这行信息是唯一能直接定位该问题的证据。
      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      - name: 编译 Debug
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          status=$?
          cat gradle-build.log
          exit $status

      # Actions 日志需要登录才能下载，把 Gradle 的失败摘要发布为注解后，公开 API 即可读到失败原因。
      - name: 输出构建失败原因
        if: failure()
        run: |
          BLOCK="$(sed -n '/What went wrong/,/^\* Try:/p' gradle-build.log | head -12)"
          if [ -z "$BLOCK" ]; then BLOCK="$(tail -12 gradle-build.log)"; fi
          printf '%s\n' "$BLOCK" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 单元测试与覆盖率
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --stacktrace

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/jacoco/jacocoTestReport
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  instrumented:
    name: 设备测试（Room / Hilt / Compose）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 输出构建环境信息
        run: |
          java -version
          ./gradlew --version

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE=="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 在模拟器运行 connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > android-test.log 2>&1
            status=$?
            cat android-test.log
            exit $status

      - name: 输出设备测试失败原因
        if: failure()
        run: |
          BLOCK="$(sed -n '/What went wrong/,/^\* Try:/p' android-test.log 2>/dev/null | head -12)"
          if [ -z "$BLOCK" ]; then BLOCK="$(tail -12 android-test.log 2>/dev/null)"; fi
          printf '%s\n' "$BLOCK" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: 上传设备测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results
          if-no-files-found: warn
